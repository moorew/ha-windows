name: Overlay preview

on:
  push:
    branches: [overlay-preview]
    paths:
      - 'tools/jarvis-overlay/jarvis-overlay.ps1'
      - 'tools/jarvis-overlay/preview/*.ps1'
      - '.github/workflows/overlay-preview.yml'

permissions:
  contents: write

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Render the overlay against a scripted event stream
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/jarvis-overlay/preview/run-preview.ps1

      - name: Commit screenshots back to the branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/jarvis-overlay/preview/out
          git commit -m "Overlay preview screenshots [skip ci]" || echo "nothing to commit"
          git push
