name: Build event-stream exe

on:
  push:
    branches: [ci/event-stream-build]
    paths-ignore:
      - 'ci-results/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements-windows.txt
            pyproject.toml

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24.0" --only-binary=:all:
          pip install -r requirements-windows.txt
          pip install pytest pytest-asyncio hypothesis

      - name: Run tests on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-results | Out-Null
          python -m pytest tests/test_event_stream.py -q -p no:cacheprovider *>&1 | Tee-Object -FilePath ci-results/event-stream-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests -q -p no:cacheprovider *>&1 | Tee-Object -FilePath ci-results/full-suite.txt
          exit 0

      - name: Build single-file exe
        shell: pwsh
        run: |
          python setup.py --build *>&1 | Tee-Object -FilePath ci-results/pyinstaller.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $h = (Get-FileHash dist/HomeAssistantWindows.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $len = (Get-Item dist/HomeAssistantWindows.exe).Length
          "$h  HomeAssistantWindows.exe  $len bytes  run $env:GITHUB_RUN_ID  commit $env:GITHUB_SHA" | Set-Content ci-results/sha256.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ha-assistant-windows-exe
          path: dist/HomeAssistantWindows.exe
          if-no-files-found: error

      - name: Commit results back to the branch
        if: always()
        shell: bash
        run: |
          tail -c 200000 ci-results/pyinstaller.log > ci-results/pyinstaller-tail.txt 2>/dev/null || true
          rm -f ci-results/pyinstaller.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results
          git commit -m "CI results [skip ci]" || echo "nothing to commit"
          git push
